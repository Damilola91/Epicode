<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/loader.css">
    <link rel="stylesheet" href="./css/style.css">
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Place</title>
</head>
<body>

    <div class="container mt-5">
        <h1>Create a New Product</h1>
        <form action="/submit-product" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Nome del Prodotto:</label>
                <input type="text" class="form-control" id="name" name="inputName" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Descrizione:</label>
                <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label for="brand" class="form-label">Marca:</label>
                <input type="text" class="form-control" id="brand" name="brand" required>
            </div>
            <div class="mb-3">
                <label for="imageUrl" class="form-label">URL dell'Immagine:</label>
                <input type="url" class="form-control" id="image" name="imageUrl" required>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Prezzo:</label>
                <input type="number" class="form-control" id="price" name="priceValue" required step="0.01" min="0">
            </div>
            <div class="d-flex gap-1">
                <button type="submit" class="btn btn-primary" id="button" >Crea Prodotto</button>
                <button type="submit" class="btn btn-warning" id="backEnd" >Back End</button>
                <button type="submit" class="btn btn-success" id="vetrina" >Vetrina</button>

            </div>
          

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script type="module" src="./js/script.js"></script>   
</body>
</html>
